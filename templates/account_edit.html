{% extends 'base.html' %}

{% block extra_css %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/account.css') }}"
>
{% endblock %}

{% block title %}Edit Profile - Dépôt Les Sources{% endblock %}

{% block content %}

<div class="account-container">

    <div class="account-header">

        <div>
            <h1>Edit Profile</h1>
            <p>Update your personal information.</p>
        </div>

    </div>


    <section class="account-card">

        <div class="card-header">
            <h2>Personal Information</h2>
        </div>


        {% if error %}

        <div class="form-error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('account_edit') }}"
            class="profile-form"
        >

            <div class="form-row">

                <div class="form-group">

                    <label for="userName">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="userName"
                        name="userName"
                        value="{{ customer['userName'] or '' }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="userSurname">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="userSurname"
                        name="userSurname"
                        value="{{ customer['userSurname'] or '' }}"
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="userMail">
                        Email
                    </label>

                   <input
                      type="email"
                        id="userMail"
                        name="userMail"
                        value="{{ customer['userMail'] or '' }}"
                        maxlength="254"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="userPhone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="userPhone"
                        name="userPhone"
                        value="{{ customer['userPhone'] or '' }}"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="userGender">
                        Gender
                    </label>

                    <select
                        id="userGender"
                        name="userGender"
                    >

                        <option
                            value=""
                            {% if not customer['userGender'] %}
                            selected
                            {% endif %}
                        >
                            Select gender
                        </option>

                        <option
                            value="Male"
                            {% if customer['userGender'] == 'Male' %}
                            selected
                            {% endif %}
                        >
                            Male
                        </option>

                        <option
                            value="Female"
                            {% if customer['userGender'] == 'Female' %}
                            selected
                            {% endif %}
                        >
                            Female
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="userBirthDate">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="userBirthDate"
                        name="userBirthDate"
                        value="{{ customer['userBirthDate'] or '' }}"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="userAddress">
                    Address
                </label>

                <textarea
                    id="userAddress"
                    name="userAddress"
                    rows="4"
                >{{ customer['userAddress'] or '' }}</textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('account') }}"
                    class="cancel-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </section>

</div>

{% endblock %}
